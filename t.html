<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إنشاء امتحان - المنصة التعليمية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/mathlive@0.98/dist/mathlive.min.js"></script>

    <style>
        :root {
            --bg: #0B1220;
            --surface: #121B2E;
            --surface-2: #1A2540;
            --border: #263251;
            --gold: #D4A954;
            --gold-dim: #8A7038;
            --teal: #4FB6A6;
            --red: #E2695B;
            --text: #ECEFF6;
            --text-mute: #8A93A6;
            --radius: 14px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; min-height: 100%;
            background: radial-gradient(circle at 50% 0%, #16213A 0%, var(--bg) 55%);
            color: var(--text); font-family: 'Tajawal', sans-serif;
        }

        .latin, input, textarea, .kbd-key.num, .badge-count { font-family: 'JetBrains Mono', monospace; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 22px; background: linear-gradient(180deg, rgba(18,27,46,.95), rgba(18,27,46,.7));
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(8px);
        }
        .topbar h1 { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 18px; margin: 0; color: var(--gold); }
        .topbar .sub { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
        .count-badge { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 7px 16px; font-size: 13px; color: var(--text-mute); }
        .count-badge .latin { color: var(--teal); font-weight: 700; }

        .wrap { max-width: 780px; margin: 0 auto; padding: 20px 22px 260px; }
        .exam-title-row { margin-bottom: 20px; }
        .exam-title-row label { font-size: 13px; color: var(--text-mute); display: block; margin-bottom: 6px; }
        .exam-title-field {
            width: 100%; background: var(--surface); border: 1.5px solid var(--border);
            border-radius: 12px; padding: 14px 16px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 17px; color: var(--text);
        }
        .exam-title-field:focus, .exam-title-field.active-field { outline: none; border-color: var(--teal); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); margin-bottom: 24px; }
        .card h2 { font-family: 'Cairo', sans-serif; font-size: 16px; color: var(--gold); margin: 0 0 18px; }
        .type-toggle { display: flex; gap: 10px; margin-bottom: 18px; }
        .type-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text-mute); font-family: 'Cairo', sans-serif; font-weight: 700; cursor: pointer; text-align: center; font-size: 14px; }
        .type-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,169,84,.08); }
        .field-group { margin-bottom: 18px; }
        .field-group label { font-size: 13px; color: var(--text-mute); display: block; margin-bottom: 8px; }
        
        .q-text-field { width: 100%; min-height: 90px; resize: vertical; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; line-height: 2; padding: 14px 16px; caret-color: var(--gold); }
        .q-text-field:focus, .q-text-field.active-field { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(79,182,166,.12); }
        
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-row { display: flex; align-items: center; gap: 10px; }
        .option-letter { width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1.5px solid var(--border); color: var(--gold); font-family: 'JetBrains Mono', monospace; font-weight: 700; transition: all .12s; }
        .option-letter.correct { background: var(--teal); border-color: var(--teal); color: #06201B; }
        .option-field { flex: 1; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 15px; }
        .option-field:focus, .option-field.active-field { outline: none; border-color: var(--teal); }
        .options-hint { font-size: 12px; color: var(--text-mute); margin-top: 2px; }

        .composer-actions { display: flex; gap: 10px; margin-top: 6px; }
        .btn { font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 14.5px; border: none; border-radius: 10px; padding: 12px 22px; cursor: pointer; transition: transform .1s, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;}
        .btn:active { transform: scale(.97); }
        .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { filter: brightness(1.15); }
        .btn-primary { background: linear-gradient(135deg, var(--gold), #B98B3D); color: #221705; }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-teal { background: linear-gradient(135deg, var(--teal), #2F8A7C); color: #06201B; }

        .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .list-header h2 { font-family: 'Cairo', sans-serif; font-size: 16px; color: var(--text); margin: 0; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-mute); font-size: 14px; border: 1.5px dashed var(--border); border-radius: 12px; }
        .q-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
        .q-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
        .q-item-num { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 13px; color: var(--gold); }
        .q-item-type { font-size: 11px; color: var(--text-mute); border: 1px solid var(--border); padding: 3px 9px; border-radius: 7px; }
        .q-item-text { font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 15.5px; line-height: 1.9; margin-bottom: 10px; }
        .q-item-options { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
        .q-item-options .op { display: flex; gap: 8px; align-items: center; color: var(--text-mute); }
        .q-item-options .op.correct { color: var(--teal); font-weight: 700; }
        .q-item-actions { display: flex; gap: 8px; margin-top: 12px; }
        .icon-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-mute); border-radius: 8px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; font-family: 'Cairo', sans-serif; }
        .icon-btn.danger:hover { border-color: var(--red); color: var(--red); }
        .icon-btn:hover:not(.danger) { border-color: var(--gold-dim); color: var(--gold); }
        .export-row { display: flex; gap: 10px; margin-top: 20px; }
        .export-row .btn { flex: 1; }

        /* الكيبورد الافتراضي */
        .kbd-panel { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: linear-gradient(180deg, #101A2E, #0C1424); border-top: 1px solid var(--border); box-shadow: 0 -18px 40px -12px rgba(0,0,0,.55); transform: translateY(calc(100% - 46px)); transition: transform .28s ease; }
        .kbd-panel.open { transform: translateY(0); }
        .kbd-drag { height: 46px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; position: relative; }
        .kbd-drag .grip { width: 38px; height: 4px; border-radius: 2px; background: var(--border); }
        .kbd-drag .drag-label { position: absolute; right: 20px; font-size: 12px; color: var(--text-mute); }
        .kbd-drag .drag-label.active { color: var(--teal); }
        .kbd-tabs { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
        .kbd-tabs::-webkit-scrollbar { display: none; }
        .kbd-tab { font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 13px; padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-mute); cursor: pointer; white-space: nowrap; }
        .kbd-tab.active { background: var(--gold); color: #221705; border-color: var(--gold); }
        .kbd-tab.math-tab.active { background: var(--teal); color: #06201B; border-color: var(--teal); }

        .kbd-body { padding: 0 12px 16px; max-width: 780px; margin: 0 auto; }
        .kbd-rows { display: flex; flex-direction: column; gap: 8px; }
        .kbd-row { display: flex; gap: 6px; justify-content: center; width: 100%; }
        .kbd-key { flex: 1; max-width: 52px; height: 46px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-size: 17px; cursor: pointer; user-select: none; transition: background .1s, transform .05s; }
        .kbd-key:active { background: var(--gold-dim); transform: scale(.94); }
        .kbd-key.wide { max-width: 120px; flex: 2; font-size: 13px; font-family: 'Cairo', sans-serif; font-weight: 700; }
        .kbd-key.shift { max-width: 60px; flex: 1.5; font-size: 14px; background: var(--border); }
        .kbd-key.shift.active { background: var(--gold); color: #221705; }
        .kbd-key.space { max-width: none; flex: 6; }
        .kbd-key.func { color: var(--gold); border-color: var(--gold-dim); }

        .math-panel { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        math-field { width: 100%; min-height: 52px; border-radius: 10px; border: 1.5px solid var(--gold-dim); background: var(--bg); font-size: 19px; padding: 6px 10px; }
        .math-shortcuts { display: flex; gap: 8px; width: 100%; }
        .math-shortcuts .btn { flex: 1; font-size: 13px; padding: 8px; font-family: 'JetBrains Mono', monospace; }
        .math-actions { display: flex; gap: 10px; width: 100%; }
        .math-actions .btn { flex: 1; }

        .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--surface-2); border: 1px solid var(--teal); color: var(--text); padding: 10px 20px; border-radius: 10px; font-size: 14px; z-index: 100; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 520px) { .q-text-field { font-size: 15px; } .kbd-key { height: 42px; font-size: 15px; } }
    </style>
</head>
<body>

    <div class="topbar">
        <div>
            <h1>إنشاء امتحان</h1>
            <div class="sub">اكتب أسئلتك ثم صدّر الامتحان</div>
        </div>
        <div class="count-badge">عدد الأسئلة: <span class="latin" id="qCountBadge">0</span></div>
    </div>

    <div class="wrap">
        <div class="exam-title-row">
            <label>عنوان الامتحان</label>
            <input type="text" class="exam-title-field answer-field" id="examTitle" readonly inputmode="none" placeholder="مثال: امتحان الوحدة الثانية - الصف الخامس">
        </div>

        <div class="card">
            <h2 id="composerHeading">سؤال جديد</h2>
            
            <div class="type-toggle">
                <div class="type-btn active" data-type="mcq">اختياري (4 خيارات)</div>
                <div class="type-btn" data-type="essay">مقالي</div>
            </div>

            <div class="field-group">
                <label>نص السؤال</label>
                <textarea class="q-text-field answer-field" id="qTextField" readonly inputmode="none" placeholder="اضغط هنا واكتب نص السؤال"></textarea>
            </div>

            <div class="field-group" id="optionsWrap">
                <label>الخيارات — اضغط على الحرف لتحديد الإجابة الصحيحة</label>
                <div class="options-grid" id="optionsGrid"></div>
            </div>

            <div class="composer-actions">
                <button class="btn btn-primary" id="addQuestionBtn">إضافة السؤال</button>
                <button class="btn btn-ghost" id="clearComposerBtn">مسح الحقول</button>
            </div>
        </div>

        <div class="list-header">
            <h2>الأسئلة المضافة</h2>
        </div>
        <div id="questionList"></div>
        <div class="empty-state" id="emptyState">لسه مفيش أسئلة مضافة. اكتب سؤالك الأول بالأعلى.</div>

        <div class="export-row">
            <button class="btn btn-teal" id="exportBtn">تنزيل الامتحان (JSON)</button>
            <button class="btn btn-ghost" id="previewBtn">معاينة كنص</button>
        </div>
    </div>

    <!-- لوحة المفاتيح الافتراضية -->
    <div class="kbd-panel" id="kbdPanel">
        <div class="kbd-drag" id="kbdDrag">
            <span class="drag-label" id="dragLabel">اضغط على أي حقل للكتابة</span>
            <div class="grip"></div>
        </div>
        <div class="kbd-tabs">
            <button class="kbd-tab active" data-tab="letters">أ عربي</button>
            <button class="kbd-tab" data-tab="english" style="font-family:'JetBrains Mono',monospace;">Abc</button>
            <button class="kbd-tab" data-tab="numbers">١٢٣ أرقام</button>
            <button class="kbd-tab math-tab" data-tab="math">∑ معادلة</button>
        </div>
        <div class="kbd-body">
            
            <!-- تبويب الحروف العربية -->
            <div class="kbd-panel-view" id="view-letters">
                <div class="kbd-rows">
                    <div class="kbd-row" id="rowAr1"></div>
                    <div class="kbd-row" id="rowAr2"></div>
                    <div class="kbd-row" id="rowAr3"></div>
                    <div class="kbd-row">
                        <div class="kbd-key wide func" data-action="backspace">⌫ حذف</div>
                        <div class="kbd-key space" data-action="space">مسافة</div>
                        <div class="kbd-key wide func" data-action="enter">↵ سطر</div>
                    </div>
                </div>
            </div>

            <!-- تبويب الحروف الإنجليزية -->
            <div class="kbd-panel-view" id="view-english" style="display:none;">
                <div class="kbd-rows">
                    <div class="kbd-row latin" id="rowEn1"></div>
                    <div class="kbd-row latin" id="rowEn2"></div>
                    <div class="kbd-row">
                        <div class="kbd-key shift" id="shiftBtn">⬆ Shift</div>
                        <div class="kbd-row latin" id="rowEn3" style="flex:4; gap:6px;"></div>
                    </div>
                    <div class="kbd-row">
                        <div class="kbd-key wide func" data-action="backspace">⌫ حذف</div>
                        <div class="kbd-key space" data-action="space">مسافة</div>
                        <div class="kbd-key wide func" data-action="enter">↵ سطر</div>
                    </div>
                </div>
            </div>

            <!-- تبويب الأرقام والرموز -->
            <div class="kbd-panel-view" id="view-numbers" style="display:none;">
                <div class="kbd-rows">
                    <div class="kbd-row" id="rowNum1"></div>
                    <div class="kbd-row" id="rowNum2"></div>
                    <div class="kbd-row">
                        <div class="kbd-key wide func" data-action="backspace">⌫ حذف</div>
                        <div class="kbd-key space" data-action="space">مسافة</div>
                        <div class="kbd-key wide func" data-action="enter">↵ سطر</div>
                    </div>
                </div>
            </div>

            <!-- تبويب المعادلات -->
            <div class="kbd-panel-view" id="view-math" style="display:none;">
                <div class="math-panel">
                    <!-- أزرار الاختصارات الرياضية السريعة -->
                    <div class="math-shortcuts">
                        <button class="btn btn-ghost" onmousedown="insertMathCmd('\\frac{#0}{#0}')" title="إدراج كسر">
                            x/y كسر
                        </button>
                        <button class="btn btn-ghost" onmousedown="insertMathCmd('^{#0}')" title="أس أو حرف علوي">
                            x² أس
                        </button>
                        <button class="btn btn-ghost" onmousedown="insertMathCmd('_{#0}')" title="دليل سفلي">
                            x₂ أسفل
                        </button>
                    </div>

                    <math-field id="mathField" virtual-keyboard-mode="onfocus" math-virtual-keyboard-policy="manual"></math-field>
                    
                    <div class="math-actions">
                        <button class="btn btn-ghost" id="mathClearBtn">مسح</button>
                        <button class="btn btn-ghost" id="mathCopyBtn">نسخ</button>
                        <button class="btn btn-primary" id="mathInsertBtn">إدراج للنص</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ================= إعدادات واجهة الامتحانات ================= */
        let currentType = 'mcq';
        let editingIndex = null;
        const exam = { title: '', questions: [] };
        const optionsGrid = document.getElementById('optionsGrid');
        let correctKey = null;

        function buildOptionRows() {
            optionsGrid.innerHTML = '';
            ['a', 'b', 'c', 'd'].forEach(key => {
                const row = document.createElement('div');
                row.className = 'option-row';
                row.innerHTML = `
                    <div class="option-letter latin" data-key="${key}">${key}</div>
                    <input type="text" class="option-field answer-field" data-opt="${key}" readonly inputmode="none" placeholder="نص الخيار ${key}">
                `;
                optionsGrid.appendChild(row);
            });
            optionsGrid.querySelectorAll('.option-letter').forEach(el => {
                el.addEventListener('click', () => {
                    correctKey = el.dataset.key;
                    optionsGrid.querySelectorAll('.option-letter').forEach(l => l.classList.remove('correct'));
                    el.classList.add('correct');
                });
            });
        }
        buildOptionRows();

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                document.getElementById('optionsWrap').style.display = currentType === 'mcq' ? 'block' : 'none';
            });
        });

        const qTextField = document.getElementById('qTextField');
        document.getElementById('addQuestionBtn').addEventListener('click', () => {
            const text = qTextField.value.trim();
            if (!text) return showToast('اكتب نص السؤال أولًا');
            let question = { type: currentType, text };
            if (currentType === 'mcq') {
                const options = [];
                let allFilled = true;
                optionsGrid.querySelectorAll('.option-field').forEach(f => {
                    const val = f.value.trim();
                    if (!val) allFilled = false;
                    options.push({ key: f.dataset.opt, text: val });
                });
                if (!allFilled) return showToast('اكتب كل الخيارات الأربعة');
                if (!correctKey) return showToast('حدد الإجابة الصحيحة بالضغط على الحرف');
                question.options = options;
                question.answer = correctKey;
            }
            if (editingIndex !== null) {
                exam.questions[editingIndex] = question;
                editingIndex = null;
                document.getElementById('composerHeading').textContent = 'سؤال جديد';
            } else exam.questions.push(question);
            resetComposer();
            renderList();
            showToast('تم حفظ السؤال ✓');
        });

        document.getElementById('clearComposerBtn').addEventListener('click', resetComposer);
        function resetComposer() {
            qTextField.value = ''; correctKey = null; buildOptionRows();
            editingIndex = null; document.getElementById('composerHeading').textContent = 'سؤال جديد';
            hideKeyboard();
        }

        function renderList() {
            const listEl = document.getElementById('questionList');
            const empty = document.getElementById('emptyState');
            document.getElementById('qCountBadge').textContent = exam.questions.length;
            if (exam.questions.length === 0) {
                listEl.innerHTML = ''; empty.style.display = 'block'; return;
            }
            empty.style.display = 'none';
            listEl.innerHTML = exam.questions.map((q, i) => {
                let optsHtml = '';
                if (q.type === 'mcq') optsHtml = `<div class="q-item-options">` + q.options.map(o => `<span class="op ${o.key === q.answer ? 'correct' : ''}"><span class="latin">${o.key})</span> ${o.text}</span>`).join('') + `</div>`;
                return `<div class="q-item">
                    <div class="q-item-top"><span class="q-item-num">سؤال <span class="latin">${i + 1}</span></span><span class="q-item-type">${q.type === 'mcq' ? 'اختياري' : 'مقالي'}</span></div>
                    <div class="q-item-text">${q.text}</div>${optsHtml}
                    <div class="q-item-actions"><button class="icon-btn" data-edit="${i}">تعديل</button><button class="icon-btn danger" data-delete="${i}">حذف</button></div>
                </div>`;
            }).join('');
            renderMathInElement(listEl, { delimiters: [{ left: '$$', right: '$$', display: false }], throwOnError: false });
            listEl.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => editQuestion(parseInt(b.dataset.edit))));
            listEl.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => { exam.questions.splice(parseInt(b.dataset.delete), 1); renderList(); }));
        }

        function editQuestion(i) {
            const q = exam.questions[i];
            editingIndex = i; document.getElementById('composerHeading').textContent = `تعديل السؤال ${i + 1}`;
            currentType = q.type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === q.type));
            document.getElementById('optionsWrap').style.display = q.type === 'mcq' ? 'block' : 'none';
            qTextField.value = q.text;
            if (q.type === 'mcq') {
                buildOptionRows();
                q.options.forEach(o => { const f = optionsGrid.querySelector(`[data-opt="${o.key}"]`); if (f) f.value = o.text; });
                correctKey = q.answer;
                optionsGrid.querySelectorAll('.option-letter').forEach(l => l.classList.toggle('correct', l.dataset.key === correctKey));
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (exam.questions.length === 0) return showToast('أضف سؤالًا واحدًا على الأقل');
            exam.title = document.getElementById('examTitle').value.trim() || 'امتحان بدون عنوان';
            const blob = new Blob([JSON.stringify(exam, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'exam.json'; a.click();
            URL.revokeObjectURL(url); showToast('تم تنزيل ملف الامتحان ✓');
        });
        document.getElementById('previewBtn').addEventListener('click', () => {
            if (exam.questions.length === 0) return showToast('أضف سؤالًا واحدًا على الأقل');
            console.log(JSON.stringify(exam, null, 2)); showToast('تم طباعة البيانات في Console');
        });

        /* ================= لوحة المفاتيح الافتراضية ================= */
        const kbdPanel = document.getElementById('kbdPanel');
        const dragLabel = document.getElementById('dragLabel');
        let activeField = null; let caretPos = 0; let isShift = false;

        const arabicRows = [
            ['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ه', 'خ', 'ح'],
            ['ج', 'د', 'ش', 'س', 'ي', 'ب', 'ل', 'ا', 'ت', 'ن'],
            ['م', 'ك', 'ط', 'ئ', 'ء', 'ؤ', 'ر', 'لا', 'ى', 'ة'],
        ];
        const numberRows = [
            ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
            ['+', '-', '×', '÷', '=', '(', ')', '.', ',', '%'],
        ];
        const enLower = [
            ['q','w','e','r','t','y','u','i','o','p'],
            ['a','s','d','f','g','h','j','k','l'],
            ['z','x','c','v','b','n','m']
        ];
        const enUpper = [
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['Z','X','C','V','B','N','M']
        ];

        function createKeyElement(ch, cls = '') {
            const key = document.createElement('div');
            key.className = 'kbd-key ' + cls;
            key.textContent = ch;
            key.addEventListener('mousedown', (e) => { e.preventDefault(); insertChar(key.textContent); });
            key.addEventListener('touchstart', (e) => { e.preventDefault(); insertChar(key.textContent); }, { passive: false });
            return key;
        }

        function buildKeys(rowIds, rows, cls = '') {
            rowIds.forEach((rowId, i) => {
                const rowEl = document.getElementById(rowId);
                rowEl.innerHTML = '';
                rows[i].forEach(ch => rowEl.appendChild(createKeyElement(ch, cls)));
            });
        }

        function renderEnglishKeyboard() {
            const rows = isShift ? enUpper : enLower;
            buildKeys(['rowEn1', 'rowEn2', 'rowEn3'], rows, 'latin');
        }

        // بناء اللوحات الأساسية
        buildKeys(['rowAr1', 'rowAr2', 'rowAr3'], arabicRows, '');
        buildKeys(['rowNum1', 'rowNum2'], numberRows, 'num latin');
        renderEnglishKeyboard();

        // زر التبديل Shift
        const shiftBtn = document.getElementById('shiftBtn');
        shiftBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isShift = !isShift;
            shiftBtn.classList.toggle('active', isShift);
            renderEnglishKeyboard();
        });
        shiftBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isShift = !isShift;
            shiftBtn.classList.toggle('active', isShift);
            renderEnglishKeyboard();
        }, { passive: false });

        document.addEventListener('click', (e) => { const field = e.target.closest('.answer-field'); if (field) activateField(field); });
        document.addEventListener('touchend', (e) => { const field = e.target.closest('.answer-field'); if (field) setTimeout(() => activateField(field), 30); }, { passive: true });

        function activateField(field) {
            document.querySelectorAll('.answer-field').forEach(f => f.classList.remove('active-field'));
            field.classList.add('active-field'); activeField = field;
            caretPos = field.selectionStart ?? field.value.length;
            dragLabel.textContent = 'جاهز للكتابة'; dragLabel.classList.add('active'); openKeyboard();
        }

        function insertChar(ch) {
            if (!activeField) return;
            const val = activeField.value;
            activeField.value = val.slice(0, caretPos) + ch + val.slice(caretPos);
            caretPos += ch.length; refocusCaret();
        }

        function backspace() {
            if (!activeField || caretPos === 0) return;
            const val = activeField.value;
            activeField.value = val.slice(0, caretPos - 1) + val.slice(caretPos);
            caretPos -= 1; refocusCaret();
        }

        function refocusCaret() { activeField.focus(); try { activeField.setSelectionRange(caretPos, caretPos); } catch (e) {} }

        document.querySelectorAll('[data-action]').forEach(el => {
            el.addEventListener('mousedown', (e) => {
                e.preventDefault(); const action = el.dataset.action;
                if (action === 'backspace') backspace();
                else if (action === 'space') insertChar(' ');
                else if (action === 'enter') { if (activeField && activeField.tagName === 'TEXTAREA') insertChar('\n'); else hideKeyboard(); }
            });
        });

        function openKeyboard() { kbdPanel.classList.add('open'); }
        function hideKeyboard() {
            kbdPanel.classList.remove('open');
            if (activeField) { activeField.classList.remove('active-field'); activeField = null; }
            dragLabel.textContent = 'اضغط على أي حقل للكتابة'; dragLabel.classList.remove('active');
        }

        document.getElementById('kbdDrag').addEventListener('click', () => { kbdPanel.classList.contains('open') ? hideKeyboard() : (activeField && openKeyboard()); });

        document.querySelectorAll('.kbd-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.kbd-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.kbd-panel-view').forEach(v => v.style.display = 'none');
                document.getElementById('view-' + tab.dataset.tab).style.display = 'block';
            });
        });

        /* ================= MathLive Shortcuts & Commands ================= */
        const mathField = document.getElementById('mathField');
        
        // دالة لإدراج الاختصارات الرياضية مباشرة داخل حقل MathLive
        window.insertMathCmd = function(cmd) {
            event.preventDefault();
            mathField.insert(cmd);
            mathField.focus();
        };

        document.getElementById('mathInsertBtn').addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (!activeField) return showToast('اضغط أولًا داخل الحقل الذي تريد الكتابة فيه');
            const latex = mathField.getValue('latex');
            if(latex) {
                insertChar(`$$${latex}$$`);
                showToast('تم إدراج المعادلة ✓');
            }
        });

        document.getElementById('mathCopyBtn').addEventListener('mousedown', (e) => {
            e.preventDefault();
            const latex = mathField.getValue('latex');
            if(latex) navigator.clipboard.writeText(`$$${latex}$$`).then(() => showToast('تم نسخ المعادلة ✓'));
        });

        document.getElementById('mathClearBtn').addEventListener('mousedown', (e) => {
            e.preventDefault();
            mathField.setValue('');
        });

        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
        }

        renderList();
    </script>
</body>
</html>
