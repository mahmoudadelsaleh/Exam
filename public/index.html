<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات الذكية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #FFD700;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }
        h1 { text-align: center; color: #FFD700; }
        label { display: block; margin-top: 15px; color: #c0c0c0; }
        select, input {
            width: 100%; padding: 10px; margin-top: 5px;
            background: #2a2a2a; color: #fff;
            border: 1px solid #FFD700; border-radius: 6px;
            font-family: 'Cairo', sans-serif; font-size: 16px;
        }
        button {
            width: 100%; padding: 15px; margin-top: 20px;
            background: #FFD700; color: #121212;
            border: none; border-radius: 6px;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #e5c100; }
        .quiz-area { margin-top: 20px; }
        .question-card { background: #2a2a2a; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-right: 4px solid #FFD700; }
    </style>
</head>
<body>

<div class="container">
    <h1>مولّد الاختبارات الذكي</h1>
    
    <label>الصف الدراسي:</label>
    <select id="grade"><option value="الخامس الابتدائي">الخامس الابتدائي</option></select>

    <label>المادة:</label>
    <select id="subject"><option value="الرياضيات">الرياضيات</option></select>

    <label>الوحدة / الدرس:</label>
    <input type="text" id="lesson" placeholder="مثال: الكسور الاعتيادية" required>

    <label>عدد الأسئلة:</label>
    <input type="number" id="numQuestions" value="5" min="1" max="10">

    <label>درجة كل سؤال:</label>
    <input type="number" id="marks" value="2" min="1">

    <label>
        <input type="checkbox" id="allowEssay" style="width: auto;"> السماح بأسئلة مقالية
    </label>

    <button onclick="generateQuiz()">توليد الاختبار الآن</button>

    <div id="quizContainer" class="quiz-area"></div>
</div>

<script>
    async function generateQuiz() {
        const btn = document.querySelector('button');
        btn.innerText = "جاري التوليد... (يرجى الانتظار)";
        
        const payload = {
            grade: document.getElementById('grade').value,
            subject: document.getElementById('subject').value,
            lesson: document.getElementById('lesson').value,
            numQuestions: document.getElementById('numQuestions').value,
            marksPerQuestion: document.getElementById('marks').value,
            allowEssay: document.getElementById('allowEssay').checked
        };

        try {
            const res = await fetch('/api/generate-quiz', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            renderQuiz(data.questions || data);
        } catch (e) {
            alert("حدث خطأ في الاتصال بالخادم.");
        }
        btn.innerText = "توليد الاختبار الآن";
    }

    function renderQuiz(questions) {
        const container = document.getElementById('quizContainer');
        container.innerHTML = '<h2>الاختبار:</h2>';
        questions.forEach((q, index) => {
            let html = `<div class="question-card">
                <p><strong>س${index + 1}:</strong> ${q.questionText}</p>`;
            
            if (!q.isEssay && q.options && q.options.length > 0) {
                q.options.forEach(opt => {
                    html += `<label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label><br>`;
                });
            } else {
                html += `<textarea rows="3" style="width:100%; margin-top:10px;" placeholder="اكتب إجابتك هنا..."></textarea>`;
            }
            html += `</div>`;
            container.innerHTML += html;
        });
        container.innerHTML += `<button onclick="alert('سيتم برمجة التصحيح التلقائي لاحقاً!')">تسليم الإجابات</button>`;
    }
</script>

</body>
</html>
