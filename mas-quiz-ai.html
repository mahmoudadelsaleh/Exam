<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المنظومة التعليمية الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #0d9488;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --danger: #ef4444;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; width: 100%; }
        
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 5px; }

        .card { background: var(--surface); padding: 20px; border-radius: var(--radius); box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }
        .card h3 { color: var(--primary); margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid var(--border); font-size: 1.2rem; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;
        }
        textarea { resize: vertical; min-height: 120px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        
        .btn { display: inline-block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--secondary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-group .btn { flex: 1; }

        #status-msg { margin-top: 10px; text-align: center; font-weight: bold; font-size: 0.9rem; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .btn-group { flex-direction: column; }
        }

        .question-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-top: 15px; }
        .option-label { display: block; padding: 10px; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
        .option-label:hover { border-color: var(--primary-light); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>
</head>
<body>

<div class="container">
    <header>
        <h1>🎓 منصة إعداد الامتحانات الذكية</h1>
        <p>معلم أول رياضيات - نظام استخراج وتوليد الأسئلة</p>
    </header>

    <div class="card">
        <h3>⚙️ إعدادات النظام والـ API</h3>
        <div class="form-group">
            <label>🔑 مفتاح Gemini API:</label>
            <input type="password" id="api-key" placeholder="أدخل مفتاحك هنا...">
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveKey()">💾 حفظ بالمحلي</button>
                <button class="btn btn-danger" onclick="deleteKey()">🗑️ مسح من الكاش</button>
            </div>
        </div>
        <div class="form-group">
            <label>🧠 اختر نموذج الذكاء الاصطناعي:</label>
            <select id="model-select">
                <option value="gemini-1.5-flash">Gemini 1.5 Flash (سريع وممتاز للامتحانات)</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro (عالي الدقة والتحليل)</option>
                <option value="gemini-1.0-pro">Gemini 1.0 Pro (الإصدار المستقر القديم)</option>
            </select>
        </div>
    </div>

    <div class="card" id="extraction-section">
        <h3>📄 استخراج المحتوى من الملفات</h3>
        <div class="form-group">
            <label>اختر ملف PDF:</label>
            <input type="file" id="file-upload" accept="application/pdf" class="btn-outline" style="padding: 5px;">
        </div>
        <div class="grid-2">
            <div class="form-group"><label>من صفحة:</label><input type="number" id="start-page" value="1" min="1"></div>
            <div class="form-group"><label>إلى صفحة:</label><input type="number" id="end-page" value="2" min="1"></div>
        </div>
        <button class="btn btn-outline" onclick="extractText()">📥 استخراج النص فقط</button>
        <div id="extract-status" id="status-msg"></div>
    </div>

    <div class="card">
        <h3>✍️ النص المستخرج (يمكنك التعديل عليه)</h3>
        <div class="form-group">
            <textarea id="extracted-text" placeholder="سيظهر النص المستخرج هنا، ويمكنك كتابة نصك الخاص مباشرة..."></textarea>
        </div>
        
        <div class="grid-2">
            <div class="form-group"><label>عدد الأسئلة المطلوبة:</label><input type="number" id="q-count" value="5" min="1"></div>
            <div class="form-group"><label>درجة السؤال:</label><input type="number" id="q-mark" value="2" min="1"></div>
        </div>
        <button class="btn btn-success" onclick="generateExam()" id="generate-btn">🚀 توليد الامتحان الآن</button>
        <div id="gen-status" style="margin-top: 10px; text-align: center; font-weight: bold; color: var(--primary);"></div>
    </div>

    <div id="exam-preview" style="display: none;" class="card">
        <h3>📋 معاينة الامتحان</h3>
        <div id="quiz-container"></div>
        <button class="btn btn-primary" style="margin-top: 20px;" onclick="window.print()">🖨️ طباعة الامتحان</button>
    </div>

</div>

<script>
    // عند تحميل الصفحة، جلب المفتاح المحفوظ إن وجد
    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('api-key').value = savedKey;
        }
    };

    function saveKey() {
        const key = document.getElementById('api-key').value.trim();
        if(key) {
            localStorage.setItem('gemini_api_key', key);
            alert("✅ تم حفظ المفتاح بنجاح في متصفحك!");
        } else {
            alert("⚠️ يرجى إدخال مفتاح أولاً.");
        }
    }

    function deleteKey() {
        localStorage.removeItem('gemini_api_key');
        document.getElementById('api-key').value = '';
        alert("🗑️ تم مسح المفتاح من الذاكرة المحلية.");
    }

    // دالة استخراج النص من الـ PDF
    async function extractText() {
        const fileInput = document.getElementById('file-upload');
        const statusEl = document.getElementById('extract-status');
        const startPage = parseInt(document.getElementById('start-page').value) || 1;
        let endPage = parseInt(document.getElementById('end-page').value) || 1;

        if (!fileInput.files.length) {
            statusEl.innerHTML = '<span style="color:red;">⚠️ الرجاء اختيار ملف PDF أولاً</span>';
            return;
        }

        statusEl.innerHTML = '⏳ جاري القراءة والاستخراج...';
        
        try {
            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            let fullText = "";

            if (endPage > pdf.numPages) endPage = pdf.numPages;

            for (let i = startPage; i <= endPage; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(" ") + "\n";
            }

            document.getElementById('extracted-text').value = fullText.trim();
            statusEl.innerHTML = '<span style="color:green;">✅ تم استخراج النص بنجاح! راجعه في المربع بالأسفل.</span>';
        } catch (error) {
            statusEl.innerHTML = `<span style="color:red;">❌ خطأ في القراءة: ${error.message}</span>`;
        }
    }

    // دالة التخاطب مع API وتوليد الامتحان
    async function generateExam() {
        const apiKey = document.getElementById('api-key').value.trim();
        const model = document.getElementById('model-select').value;
        const textToProcess = document.getElementById('extracted-text').value.trim();
        const qCount = parseInt(document.getElementById('q-count').value) || 5;
        const btn = document.getElementById('generate-btn');
        const statusEl = document.getElementById('gen-status');

        if (!apiKey) { alert("⚠️ الرجاء إدخال مفتاح API."); return; }
        if (textToProcess.length < 20) { alert("⚠️ النص المستخرج قصير جداً أو فارغ."); return; }

        btn.disabled = true;
        btn.innerHTML = '⏳ جاري التوليد (قد يستغرق بضع ثوان)...';
        statusEl.innerHTML = '';

        const prompt = `
        أنت أستاذ خبير. بناءً على النص المرفق، أنشئ ${qCount} سؤال اختيار من متعدد.
        مهم جداً: أعد الإجابة فقط بصيغة مصفوفة JSON دقيقة بدون أي نصوص إضافية أو علامات Markdown مثل \`\`\`json.
        الصيغة المطلوبة:
        [
            {
                "question": "نص السؤال؟",
                "options": ["خيار 1", "خيار 2", "خيار 3", "خيار 4"]
            }
        ]

        النص:
        ${textToProcess.substring(0, 15000)}
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.3 }
                })
            });

            const data = await response.json();

            if (data.error) throw new Error(data.error.message);

            if (data.candidates && data.candidates[0]) {
                let rawText = data.candidates[0].content.parts[0].text;
                // تنظيف النص لاصطياد الـ JSON فقط
                let jsonMatch = rawText.match(/\[[\s\S]*\]/);
                if (!jsonMatch) throw new Error("لم يقم النموذج بإرجاع البيانات بصيغة JSON صحيحة.");

                let questions = JSON.parse(jsonMatch[0]);
                renderPreview(questions);
                
                document.getElementById('exam-preview').style.display = 'block';
                statusEl.innerHTML = '✅ تم التوليد بنجاح!';
            }
        } catch (error) {
            statusEl.innerHTML = `<span style="color:red;">❌ حدث خطأ: ${error.message}</span>`;
        } finally {
            btn.disabled = false;
            btn.innerHTML = '🚀 توليد الامتحان الآن';
        }
    }

    // عرض الأسئلة في واجهة المعاينة
    function renderPreview(questions) {
        const container = document.getElementById('quiz-container');
        const qMark = document.getElementById('q-mark').value;
        container.innerHTML = '';

        questions.forEach((q, index) => {
            let optionsHTML = '';
            q.options.forEach(opt => {
                optionsHTML += `<label class="option-label"><input type="radio" disabled> ${opt}</label>`;
            });

            container.innerHTML += `
                <div class="question-card">
                    <div style="font-weight: bold; margin-bottom: 10px;">
                        س${index + 1}: ${q.question} 
                        <span style="float:left; font-size:0.8rem; background:#e2e8f0; padding:2px 8px; border-radius:4px;">(${qMark} درجات)</span>
                    </div>
                    <div>${optionsHTML}</div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
