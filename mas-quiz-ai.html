<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة توليد الامتحانات الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #0d9488;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); }
        
        .card { 
            background: var(--surface); 
            padding: 25px; 
            border-radius: var(--radius); 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
            margin-bottom: 20px; 
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary); }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
        }
        
        /* Tab Styles */
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
        .tab { 
            padding: 10px 20px; cursor: pointer; border-bottom: 3px solid transparent; 
            font-weight: 600; color: var(--text); 
        }
        .tab.active { border-bottom-color: var(--primary); color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .btn {
            display: block; width: 100%; padding: 14px; background: var(--primary);
            color: white; border: none; border-radius: 8px; font-size: 1rem;
            font-weight: 600; cursor: pointer; margin-top: 10px;
        }
        .btn:hover { background: #152e72; }

        .loading, .quiz-section { display: none; text-align: center; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--border);
            border-top: 4px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #extracted-text-preview {
            width: 100%; height: 150px; padding: 10px; border: 1px solid var(--border);
            border-radius: 8px; margin-top: 10px; background: #f1f5f9; resize: vertical;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        // Ensure PDF.js worker is set
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>
</head>
<body>

<div class="container">
    <header>
        <h1>توليد الامتحانات من الـ PDF</h1>
        <p>قم برفع الملف ليتم استخراج النص وتجهيزه للذكاء الاصطناعي</p>
    </header>

    <div class="card" id="setup-section">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('upload-tab')">إدراج ملف من الجهاز</div>
            <div class="tab" onclick="switchTab('link-tab')">رابط خارجي</div>
        </div>

        <div id="upload-tab" class="tab-content active">
            <div class="form-group">
                <label>اختر ملف PDF أو صور للصفحات</label>
                <input type="file" id="file-upload" accept="application/pdf, image/jpeg, image/png" multiple>
            </div>
            <button class="btn" onclick="processLocalFile()">قراءة الملف واستخراج المحتوى</button>
        </div>

        <div id="link-tab" class="tab-content">
            <div class="form-group">
                <label>رابط الملف المباشر (للاستخدام المستقبلي مع خادم)</label>
                <input type="text" placeholder="https://...">
                <p style="font-size: 0.85rem; color: #64748b; margin-top: 5px;">ملاحظة: الروابط المباشرة تتطلب ربط الواجهة الخلفية (Backend) لتجاوز حماية المتصفحات.</p>
            </div>
        </div>
        
        <div style="margin-top: 25px; border-top: 1px solid var(--border); padding-top: 20px;">
            <div class="form-group">
                <label>النص المستخرج (جاهز للإرسال للذكاء الاصطناعي)</label>
                <textarea id="extracted-text-preview" placeholder="سيظهر النص المستخرج هنا..."></textarea>
            </div>
            <button class="btn" style="background: var(--secondary);" onclick="simulateAIGeneration()">محاكاة توليد الامتحان من النص</button>
        </div>
    </div>

    <div class="card loading" id="loading-section">
        <div class="spinner"></div>
        <h3>جاري المعالجة...</h3>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    async function processLocalFile() {
        const fileInput = document.getElementById('file-upload');
        const preview = document.getElementById('extracted-text-preview');
        
        if (!fileInput.files.length) {
            alert("يرجى اختيار ملف أولاً");
            return;
        }

        const file = fileInput.files[0];
        preview.value = "جاري قراءة الملف...\n";
        
        if (file.type === "application/pdf") {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let fullText = "";
                
                // Read first 3 pages as an example to prevent browser freezing on large PDFs
                const numPages = Math.min(pdf.numPages, 3); 
                
                for (let i = 1; i <= numPages; i++) {
                    preview.value = `جاري قراءة الصفحة ${i} من ${pdf.numPages}...\n`;
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += `--- صفحة ${i} ---\n${pageText}\n\n`;
                }
                
                preview.value = fullText + (pdf.numPages > 3 ? "\n... (تم إيقاف القراءة عند الصفحة 3 للعرض التوضيحي)" : "");
                
            } catch (error) {
                preview.value = "حدث خطأ أثناء قراءة الـ PDF: " + error.message;
            }
        } else if (file.type.startsWith("image/")) {
            preview.value = "الملف المرفق هو صورة. لاستخراج النص منها (OCR) ستحتاج لربط مكتبة مثل Tesseract.js أو إرسالها لـ API.";
        }
    }

    function simulateAIGeneration() {
        const text = document.getElementById('extracted-text-preview').value;
        if(!text || text.includes("جاري قراءة")) {
            alert("يرجى استخراج النص بنجاح أولاً");
            return;
        }
        alert("هذا النص جاهز الآن ليتم إرساله كـ Prompt لـ API الذكاء الاصطناعي (مثل Gemini) مع أمر: استخرج أسئلة من هذا النص.");
    }
</script>
</body>
</html>
