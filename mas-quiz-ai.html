<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الذكية - التوليد الفعلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --primary-light: #3b82f6; --secondary: #0d9488; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); }
        .card { background: var(--surface); padding: 25px; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary); }
        input[type="file"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }
        .btn { display: block; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #152e72; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        #status-message { font-weight: bold; color: var(--secondary); text-align: center; margin-top: 15px; }
        
        /* Quiz Styles */
        .question-card { background: var(--bg); border-radius: 8px; padding: 18px; margin-top: 20px; border-right: 4px solid var(--primary-light); }
        .option-item { display: block; padding: 10px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
        .option-item input { margin-left: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>
</head>
<body>

<div class="container">
    <header>
        <h1>توليد الامتحانات من الـ PDF (نسخة فعلية)</h1>
        <p>يتم قراءة الملف وبناء الأسئلة الحقيقية عبر الذكاء الاصطناعي</p>
    </header>

    <div class="card" id="setup-section">
        <div class="form-group">
            <label>اختر المذكرة أو كتاب الـ PDF</label>
            <input type="file" id="file-upload" accept="application/pdf">
        </div>
        
        <button class="btn" id="start-btn" onclick="startProcess()">ابدأ القراءة والتوليد</button>
        <div id="status-message"></div>
    </div>

    <div id="quiz-container"></div>
</div>

<script>
    // ===== تنبيه هام: ضع مفتاحك هنا =====
    const GEMINI_API_KEY = "AIzaSyAX2GhGYi0B2aqDcsQLpcEhaoFrGGErKZE"; 
    // ===================================

    async function startProcess() {
        const fileInput = document.getElementById('file-upload');
        const statusEl = document.getElementById('status-message');
        const btn = document.getElementById('start-btn');

        if (!fileInput.files.length) {
            alert("يرجى اختيار ملف PDF أولاً");
            return;
        }
        
        if (GEMINI_API_KEY === "ضع_المفتاح_الخاص_بك_هنا") {
            alert("خطأ: يجب عليك وضع مفتاح API الخاص بك في الكود أولاً لكي يعمل التوليد.");
            return;
        }

        btn.disabled = true;
        statusEl.innerText = "الخطوة 1/2: جاري قراءة محتوى الملف بالكامل...";

        try {
            // 1. قراءة الملف بالكامل
            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            let fullText = "";
            
            // قراءة كل الصفحات (تم إلغاء حد الـ 3 صفحات)
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(" ") + " ";
            }

            statusEl.innerText = "الخطوة 2/2: جاري إرسال المحتوى للذكاء الاصطناعي لتأليف الامتحان... (قد يستغرق 15 ثانية)";

            // 2. إرسال النص لـ Gemini API لتوليد الأسئلة
            await generateQuizFromAI(fullText);

        } catch (error) {
            statusEl.innerText = "حدث خطأ: " + error.message;
            btn.disabled = false;
        }
    }

    async function generateQuizFromAI(extractedText) {
        const statusEl = document.getElementById('status-message');
        const btn = document.getElementById('start-btn');

        // تحديد أمر دقيق للذكاء الاصطناعي ليُرجع البيانات بصيغة برمجية قابلة للقراءة
        const prompt = `
        أنت معلم خبير. اقرأ النص التالي، وقم بتوليد 5 أسئلة اختيار من متعدد تغطي أهم المفاهيم الموجودة فيه.
        يجب أن ترد فقط بصيغة مصفوفة JSON متوافقة، بدون أي نصوص أخرى أو تنسيقات Markdown، على هذا النحو:
        [
          {
            "id": 1,
            "text": "السؤال هنا",
            "options": ["خيار 1", "خيار 2", "خيار 3", "خيار 4"],
            "correct": 0,
            "explanation": "التفسير"
          }
        ]
        النص:
        ${extractedText.substring(0, 25000)} // تحديد حجم النص لتجنب تجاوز الحد المسموح
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if(data.error) {
                throw new Error(data.error.message);
            }

            // استخراج النص البرمجي (JSON) من رد الذكاء الاصطناعي
            let aiText = data.candidates[0].content.parts[0].text;
            
            // تنظيف الرد تحسباً لوجود تنسيقات ماركداون
            aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
            
            const questions = JSON.parse(aiText);
            
            statusEl.innerText = "تم توليد الامتحان بنجاح!";
            renderQuiz(questions);

        } catch (error) {
            statusEl.innerText = "فشل في توليد الأسئلة من الذكاء الاصطناعي. تأكد من صحة الـ API Key.";
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    }

    function renderQuiz(questions) {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '<h2 style="color:var(--primary); text-align:center; margin-top:20px;">الامتحان المولد خصيصاً لك</h2>';
        
        questions.forEach((q, index) => {
            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <label class="option-item">
                        <input type="radio" name="q${q.id}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px;">سؤال ${index + 1}: ${q.text}</div>
                <div>${optionsHTML}</div>
            `;
            container.appendChild(qCard);
        });
    }
</script>
</body>
</html>
