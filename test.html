<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الذكية - التوليد الفعلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --primary-light: #3b82f6; --secondary: #0d9488; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); }
        .card { background: var(--surface); padding: 25px; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary); }
        input[type="file"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: sans-serif; }
        .btn { display: block; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #152e72; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        #status-message { font-weight: bold; color: var(--secondary); text-align: center; margin-top: 15px; }
        .error-text { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-top: 10px; text-align: right;}
        
        /* Quiz Styles */
        .question-card { background: var(--bg); border-radius: 8px; padding: 18px; margin-top: 20px; border-right: 4px solid var(--primary-light); }
        .option-item { display: block; padding: 10px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
        .option-item input { margin-left: 10px; }
        
        .hint-text { font-size: 0.85rem; color: #64748b; margin-top: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>
</head>
<body>

<div class="container">
    <header>
        <h1>توليد الامتحانات من الـ PDF</h1>
        <p>يتم قراءة الملف وبناء الأسئلة الحقيقية عبر الذكاء الاصطناعي</p>
    </header>

    <div class="card" id="setup-section">
        <div class="form-group">
            <label>مفتاح Gemini API الخاص بك</label>
            <input type="password" id="api-key-input" placeholder="أدخل المفتاح هنا (يبدأ بـ AIzaSy...)">
            <div class="hint-text">سيتم حفظ المفتاح في متصفحك محلياً لسهولة الاستخدام لاحقاً.</div>
        </div>

        <div class="form-group">
            <label>اختر المذكرة أو كتاب الـ PDF</label>
            <input type="file" id="file-upload" accept="application/pdf">
        </div>
        
        <button class="btn" id="start-btn" onclick="startProcess()">ابدأ القراءة والتوليد</button>
        <div id="status-message"></div>
    </div>

    <div id="quiz-container"></div>
</div>

<script>
    // استرجاع المفتاح المحفوظ مسبقاً عند تحميل الصفحة
    window.onload = function() {
        const savedKey = localStorage.getItem("saved_gemini_api_key");
        if (savedKey) {
            document.getElementById("api-key-input").value = savedKey;
        }
    };

    async function startProcess() {
        const fileInput = document.getElementById('file-upload');
        const apiKeyInput = document.getElementById('api-key-input').value.trim();
        const statusEl = document.getElementById('status-message');
        const btn = document.getElementById('start-btn');

        // التحقق من إدخال المفتاح
        if (!apiKeyInput) {
            alert("يرجى إدخال مفتاح Gemini API أولاً.");
            return;
        }

        // التحقق من اختيار الملف
        if (!fileInput.files.length) {
            alert("يرجى اختيار ملف PDF أولاً.");
            return;
        }

        // حفظ المفتاح في المتصفح
        localStorage.setItem("saved_gemini_api_key", apiKeyInput);

        btn.disabled = true;
        statusEl.innerHTML = "الخطوة 1/2: جاري استخراج النص من الملف...";

        try {
            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            let fullText = "";
            
            const maxPages = Math.min(pdf.numPages, 10);
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(" ") + " ";
            }

            if (fullText.trim().length === 0) {
                throw new Error("الملف يبدو كصور ممسوحة ضوئياً أو فارغ، لم يتمكن المتصفح من استخراج نصوص منه.");
            }

            statusEl.innerHTML = "الخطوة 2/2: جاري الاتصال بالذكاء الاصطناعي لتأليف الامتحان... (انتظر قليلاً)";

            // تمرير المفتاح للدالة
            await generateQuizFromAI(fullText, apiKeyInput);

        } catch (error) {
            statusEl.innerHTML = `<div class="error-text"><strong>تفاصيل الخطأ أثناء القراءة:</strong> ${error.message}</div>`;
            btn.disabled = false;
        }
    }

    // تعديل الدالة لتستقبل المفتاح كعنصر (Parameter)
    async function generateQuizFromAI(extractedText, apiKey) {
        const statusEl = document.getElementById('status-message');
        const btn = document.getElementById('start-btn');

        const prompt = `
        أنت معلم خبير. استخرج من النص التالي 5 أسئلة اختيار من متعدد مهمة.
        يجب أن ترد فقط وفقط بصيغة مصفوفة JSON متوافقة، بدون أي حرف إضافي وبدون علامات Markdown.
        مثال دقيق للمطلوب:
        [{"id":1,"text":"السؤال؟","options":["أ","ب","ج","د"],"correct":0,"explanation":"التفسير"}]
        
        النص:
        ${extractedText.substring(0, 15000)}
        `;

        try {
            // استخدام المفتاح الممرر في الرابط
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if(data.error) {
                throw new Error(data.error.message);
            }

            let aiText = data.candidates[0].content.parts[0].text;
            
            const jsonMatch = aiText.match(/\[[\s\S]*\]/);
            if (!jsonMatch) {
                throw new Error("شكل الرد من الخادم غير متوافق: " + aiText);
            }

            const questions = JSON.parse(jsonMatch[0]);
            
            statusEl.innerHTML = "<span style='color: green;'>تم توليد الامتحان بنجاح!</span>";
            renderQuiz(questions);

        } catch (error) {
            statusEl.innerHTML = `<div class="error-text"><strong>تفاصيل الخطأ من الـ API:</strong> ${error.message}</div>`;
        } finally {
            btn.disabled = false;
        }
    }

    function renderQuiz(questions) {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '<h2 style="color:var(--primary); text-align:center; margin-top:20px;">امتحانك التفاعلي</h2>';
        
        questions.forEach((q, index) => {
            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <label class="option-item">
                        <input type="radio" name="q${q.id}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px;">سؤال ${index + 1}: ${q.text}</div>
                <div>${optionsHTML}</div>
            `;
            container.appendChild(qCard);
        });
    }
</script>
</body>
</html>
